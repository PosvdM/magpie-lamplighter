name: 支持新服务 / New service
description: 希望 Lamplighter 支持 Magpie 中的其他服务 / Ask Lamplighter to support another service in Magpie
title: "支持 "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Lamplighter 用 Magpie 中的账号直接向服务商查询额度。截图和接口返回请先去掉邮箱、token 等账号信息。
        Lamplighter reads quota from the service with the accounts in Magpie. Remove emails, tokens and other account details from screenshots and responses.
  - type: input
    id: service
    attributes:
      label: 服务 / Service
      placeholder: Kimi
    validations:
      required: true
  - type: textarea
    id: windows
    attributes:
      label: 额度窗口 / Quota windows
      description: 有哪些额度窗口，例如 5 小时、7 天、月度 / Which quota windows the plan has, such as 5-hour, 7-day or monthly
    validations:
      required: true
  - type: dropdown
    id: five-hour-start
    attributes:
      label: 5 小时窗口何时开始计时 / When the 5-hour window starts
      options:
        - 重置后第一次请求时 / At the first request after a reset
        - 固定按时间滚动 / On a fixed schedule
        - 没有 5 小时窗口 / No 5-hour window
        - 不确定 / Not sure
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Magpie 中该服务的额度显示截图 / Screenshot of the service's quota in Magpie
    validations:
      required: true
  - type: textarea
    id: response
    attributes:
      label: 额度接口返回 / Quota API response
      description: Magpie 网关 GET /v1/magpie/quotas 中该服务的条目，或服务官方额度接口的响应 / The service's entry in GET /v1/magpie/quotas on the Magpie gateway, or the response of the service's own quota API
      render: json
  - type: textarea
    id: notes
    attributes:
      label: 补充说明 / Additional notes
      description: 其他有助于支持这个服务的信息，例如套餐类型、官方文档链接、特殊的重置规则 / Anything else that helps, such as plan type, links to official docs or unusual reset rules
  - type: checkboxes
    id: test
    attributes:
      label: 测试 / Testing
      options:
        - label: 我可以帮忙测试新版本 / I can test a new build
