# Pushing a v* tag tests, builds the programs for every platform, packs the
# npm package, publishes it to npm with Trusted Publishing (OIDC, no token)
# and creates a draft GitHub Release with the package attached.
# npm's Trusted Publisher setting names this file: renaming it means
# deleting that setting on npm and making it again.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check the tag against package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "the tag is $GITHUB_REF_NAME, package.json says $version" >&2
            exit 1
          fi
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: node --check internal/web/page.js
      - run: node --test internal/web/page_test.cjs
      - run: node --test npm/test/

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      # Pure Go: every platform cross-compiles statically on this runner.
      - run: sh scripts/build.sh "${GITHUB_REF_NAME#v}"
      # prepack (scripts/check-dist.mjs) checks dist/bin first.
      - run: npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: magpie-lamplighter-*.tgz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      # Trusted Publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - run: npm publish magpie-lamplighter-*.tgz

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
      - run: sha256sum magpie-lamplighter-*.tgz > checksums.txt && cat checksums.txt
      # A draft, so the release goes public only with its final notes.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --draft magpie-lamplighter-*.tgz checksums.txt
